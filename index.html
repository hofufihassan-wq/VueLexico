<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="سطر — تعلّم HTML وCSS وJavaScript وVue 3 بالعربية عبر الممارسة" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101a2b'/%3E%3Cpath d='M7 20h18' stroke='%23f2b84b' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='12' r='3' fill='%2370d6c3'/%3E%3C/svg%3E" />
    <title>سطر — تعلّم البرمجة بالممارسة</title>
    <script>
      // تطبيق الثيم قبل رسم الصفحة لتجنّب الوميض
      try {
        var s = JSON.parse(localStorage.getItem('satr:v1') || '{}')
        var t = (s.settings && s.settings.theme) || 'system'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
